<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日次PDCAプランナー</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="head-l">
        <h1>日次PDCAプランナー</h1>
        <span id="weekLabel" class="small muted">読み込み中…</span>
      </div>
      <span id="save" class="save" data-s="loading">読み込み中</span>
    </header>
    <div id="notice" class="notice" role="alert" hidden></div>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="today" aria-selected="true">今日</button>
      <button type="button" role="tab" data-tab="progress" aria-selected="false">週の進捗</button>
      <button type="button" role="tab" data-tab="month" aria-selected="false">月</button>
      <button type="button" role="tab" data-tab="setup" aria-selected="false">週の設定</button>
    </nav>
    <main id="panel" class="sheet">
      <div class="empty"><p class="muted">保存したデータを読み込んでいます。</p></div>
    </main>
  </div>
  <!-- file:// で動かすため module は使わない。planner → parser → storage → app の順 -->
  <script src="src/planner.js"></script>
  <script src="src/parser.js"></script>
  <script src="src/storage.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
